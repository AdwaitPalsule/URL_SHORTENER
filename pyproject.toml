[project]
name = "url-shortener"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

